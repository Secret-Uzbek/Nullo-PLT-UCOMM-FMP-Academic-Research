name: Terra Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check governance surface
        shell: bash
        run: |
          set -euo pipefail
          echo "## Terra Audit" >> "$GITHUB_STEP_SUMMARY"
          for file in README.md CITATION.cff SECURITY.md CONTRIBUTING.md; do
            if [ -f "$file" ]; then
              echo "- $file: YES" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $file: NO" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
