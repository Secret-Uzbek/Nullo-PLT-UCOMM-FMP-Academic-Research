name: Auto Publisher (NULLO)

permissions:
  contents: read
  security-events: write

on:
  workflow_dispatch:

jobs:
  autopublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summary
        run: |
          echo "Manual-only autopublish entrypoint." >> "$GITHUB_STEP_SUMMARY"
